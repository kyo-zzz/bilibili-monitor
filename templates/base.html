<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}B站官号数据监测{% endblock %} · bmon</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <span class="brand-dot"></span>
    <div>
      <div class="brand-name">bmon</div>
      <div class="brand-sub">B站官号数据监测</div>
    </div>
  </div>
  <nav>
    <a href="/" class="{{ 'active' if request.path == '/' }}">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>总览
    </a>
    <a href="/videos" class="{{ 'active' if request.path == '/videos' }}">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>视频数据
    </a>
    <a href="/trend" class="{{ 'active' if request.path == '/trend' }}">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3.5 18.5l6-6 4 4 7-8-1.4-1.4-5.6 6.4-4-4L2.1 17.1z"/></svg>播放趋势
    </a>
    <a href="/snapshot" class="{{ 'active' if request.path == '/snapshot' }}">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 10.4l-4 2.3-1-1.7 3-1.8V6h2z"/></svg>快照查询
    </a>
    <a href="/control" class="{{ 'active' if request.path == '/control' }}">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 4.5C7 4.5 2.7 7.6 1 12c1.7 4.4 6 7.5 11 7.5s9.3-3.1 11-7.5c-1.7-4.4-6-7.5-11-7.5zM12 17a5 5 0 1 1 5-5 5 5 0 0 1-5 5zm0-8a3 3 0 1 0 3 3 3 3 0 0 0-3-3z"/></svg>运行控制
    </a>
  </nav>
  <div class="sidebar-foot">
    <div>每天 21:30 自动采集</div>
    <div class="dim">数据仅存于本机</div>
  </div>
</aside>
<main class="content">
{% block content %}{% endblock %}
<footer class="page-foot">bmon · 本地数据 · 生成于 {{ now_str() }}</footer>
</main>
</body>
</html>

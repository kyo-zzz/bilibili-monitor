name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Compile check
        run: python -m compileall -q bmon main.py
      - name: Unit tests
        run: python -m pytest tests -q
